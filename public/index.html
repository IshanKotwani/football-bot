<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Football Bot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>⚽ Football Bot</h1>
      <button id="reset" type="button" class="ghost">New chat</button>
    </header>

    <main id="log" class="log" aria-live="polite">
      <p class="empty">
        Ask me about tactics, the laws, history, or any club or player.<br />
        My knowledge ends around mid-2025 — check a live source for current results.
      </p>
    </main>

    <form id="composer" class="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Ask about football…  (Enter to send, Shift+Enter for newline)"
        autofocus
      ></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <script type="module" src="./app.js"></script>
  </body>
</html>
